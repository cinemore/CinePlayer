name: macOS Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cineplayer-homebrew-release
  cancel-in-progress: false

jobs:
  homebrew:
    name: Verify signed release and update Homebrew
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: macos-26

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      ASSET_NAME: CinePlayer-macOS-${{ github.event.release.tag_name }}.zip
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Download published release assets
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" --pattern "${ASSET_NAME}.sha256" \
            --dir build/artifacts

      - name: Verify signed and notarized app
        run: bun scripts/verify-macos-release.ts "$RELEASE_TAG" build/artifacts

      - name: Checkout shared Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: cinemore/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update CinePlayer cask
        run: |
          bun - <<'TS'
          const version = process.env.RELEASE_TAG.slice(1);
          const checksum = await Bun.file(`build/artifacts/${process.env.ASSET_NAME}.sha256`).text();
          const sha256 = checksum.trim().split(/\s+/)[0];
          await Bun.write("homebrew-tap/Casks/cineplayer.rb", `cask "cineplayer" do
            version "${version}"
            sha256 "${sha256}"

            url "https://github.com/cinemore/CinePlayer/releases/download/v#{version}/CinePlayer-macOS-v#{version}.zip"
            name "CinePlayer"
            desc "Video player"
            homepage "https://github.com/cinemore/CinePlayer"

            app "CinePlayer.app"
          end
          `);
          TS

      - name: Commit and push Homebrew update
        working-directory: homebrew-tap
        run: |
          if [ -z "$(git status --porcelain -- Casks/cineplayer.rb)" ]; then
            echo "Homebrew already points at $RELEASE_TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cineplayer.rb
          git commit -m "chore: update cineplayer cask for ${RELEASE_TAG}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
